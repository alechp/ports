name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create tarball
        run: |
          mkdir -p dist
          tar -czf dist/ports-${{ steps.get_version.outputs.VERSION }}.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=dist \
            .

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "CHANGELOG=Initial release" >> $GITHUB_OUTPUT
          else
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
            echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.tar.gz
          body: |
            ## Installation

            ### Using Bun (recommended)
            ```bash
            bun install -g github:alechp/ports#v${{ steps.get_version.outputs.VERSION }}
            ```

            ### Manual Installation
            ```bash
            # Download and extract
            curl -L https://github.com/alechp/ports/releases/download/v${{ steps.get_version.outputs.VERSION }}/ports-${{ steps.get_version.outputs.VERSION }}.tar.gz | tar xz
            cd ports
            bun install
            bun link
            ```

            ## What's Changed
            ${{ steps.changelog.outputs.CHANGELOG }}

            **Full Changelog**: https://github.com/alechp/ports/compare/${{ steps.get_version.outputs.VERSION }}...HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
